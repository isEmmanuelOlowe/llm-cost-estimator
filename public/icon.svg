<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="labiium-icon-title labiium-icon-desc">
  <title id="labiium-icon-title">LABIIUM</title>
  <desc id="labiium-icon-desc">A periodic table cell bearing the symbol Lii, in black on white.</desc>
  <!-- Favicons are read at 16px, where a cell's number, name and mass collapse
       into noise. This variant keeps the square rule and the symbol; the full
       cell lives in apple-touch-icon.svg for large surfaces. -->
  <rect width="64" height="64" fill="#ffffff"/>
  <rect x="2.5" y="2.5" width="59" height="59" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <text x="32" y="46" text-anchor="middle" fill="#000000"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="800"><tspan font-size="40">L</tspan><tspan font-size="25" font-weight="700">ii</tspan></text>
</svg>
